_ > nanoagent.plugin.v0001.ManifestConfig:
id: retrieval-metrics-auditor
name: Retrieval Metrics Auditor
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  list_runs:
    description: List the bundled retrieval runs (run id, retriever, k, number of queries)
  get_run:
    description: Return one run's queries, each with its retrieved ids, ground-truth relevant ids and latency
  compute_metrics:
    description: Compute a run's retrieval metrics by the audit definitions (the audit-run reference)

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  audit-run:
    description: Compute a retrieval run's recall, precision, MRR, hit rate, empty rate and latency percentiles
    runner: agent
    tools: [list_runs, get_run]
    reference: compute_metrics
    instructions: |-
      Call get_run with the run_id (list_runs shows the run ids) and compute these metrics from its queries. k is the run's k. A query is evaluated when its relevant list is not empty.
      - queries_total: the number of queries in the run.
      - queries_evaluated: the number of evaluated queries.
      - recall_at_k: the mean over evaluated queries of |retrieved[:k] ∩ relevant| / |relevant|.
      - precision_at_k: the mean over evaluated queries of |retrieved[:k] ∩ relevant| / k (divide by k even when fewer were retrieved).
      - mrr: the mean over evaluated queries of 1 / (1-based rank of the first relevant example in retrieved), or 0 when none is retrieved.
      - hit_rate: the fraction of evaluated queries that retrieved at least one relevant example.
      - empty_rate: the fraction of all queries whose retrieved list is empty.
      - latency_p50_ms and latency_p95_ms: nearest-rank percentiles over all queries' latency_ms: sort ascending and take the value at 1-based position ceil(p / 100 * n).
      Round every rate to 4 decimals and copy the latencies exactly. Work through every query carefully, then submit the run_id and the metrics.
      Work out every value yourself, then end by calling the submit tool with them. Never write the answer as a chat message instead: a run that ends without a submit call fails, whatever it wrote.
